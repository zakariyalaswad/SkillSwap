<div class="min-h-screen bg-gray-50 py-10 px-4">
	<div class="max-w-5xl mx-auto">
		<div *ngIf="isLoading()" class="flex justify-center py-12">
			<div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
		</div>

		<div *ngIf="!isLoading() && profileUser() as u" class="bg-white rounded-2xl shadow-xl overflow-hidden">
			<!-- Header -->
			<div class="relative h-56 bg-linear-to-br from-indigo-500 to-blue-500 flex items-center justify-center">
				<div *ngIf="!u.photoUrl" class="text-center">
					<svg class="w-16 h-16 text-white/40 mx-auto mb-2" fill="currentColor" viewBox="0 0 24 24">
						<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
					</svg>
					<div class="px-4 py-1 rounded-full bg-white/80 text-gray-700 font-semibold inline-block">{{ u.name }}</div>
				</div>
				<img *ngIf="u.photoUrl" [src]="u.photoUrl" [alt]="u.name" class="w-full h-full object-cover">

				<!-- Rating Badge -->
				<div class="absolute top-4 right-4 bg-white/90 backdrop-blur px-3 py-1.5 rounded-full flex items-center space-x-1 shadow">
					<svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
						<path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
					</svg>
					<span class="text-sm font-semibold text-gray-800">{{ u.averageRating || 'N/A' }}</span>
				</div>
			</div>

			<!-- Body -->
			<div class="p-6 space-y-8">
				<!-- Name & location -->
				<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
					<div>
						<h1 class="text-3xl font-bold text-gray-900">{{ u.name }}</h1>
						<p *ngIf="u.location" class="text-gray-600 flex items-center mt-1">
							<svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
							</svg>
							{{ u.location }}
						</p>
					</div>
					<div class="flex gap-3">
						<button (click)="sendMessage()" class="px-5 py-3 border border-gray-300 text-gray-800 rounded-lg hover:bg-gray-50 transition font-semibold">Message</button>
						<button (click)="sendSwapRequest()" class="px-5 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-semibold">Send Swap Request</button>
					</div>
				</div>

				<!-- Bio -->
				<div *ngIf="u.bio" class="text-gray-700">
					{{ u.bio }}
				</div>

				<!-- Session Preferences -->
				<div class="flex items-center gap-4 pt-3 border-t border-gray-200">
					<div *ngIf="u.preferOnline" class="flex items-center text-gray-600">
						<svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
							<path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
						</svg>
						<span class="text-sm">Online</span>
					</div>
					<div *ngIf="u.preferOffline" class="flex items-center text-gray-600">
						<svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
							<path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
						</svg>
						<span class="text-sm">In-Person</span>
					</div>
				</div>

				<!-- Skills -->
				<div class="grid md:grid-cols-2 gap-6">
					<div>
						<h3 class="text-sm font-semibold text-gray-800 mb-2">Teaches</h3>
						<div class="flex flex-wrap gap-2">
							<span *ngFor="let s of (u.skillsITeach || [])" class="inline-flex items-center px-3 py-1 rounded-full bg-green-100 text-green-700 text-xs font-medium">
								{{ s.name }}
								<span class="ml-1 text-[10px] bg-green-700 text-white px-2 py-0.5 rounded-full">{{ s.level }}</span>
							</span>
						</div>
					</div>
					<div>
						<h3 class="text-sm font-semibold text-gray-800 mb-2">Wants to learn</h3>
						<div class="flex flex-wrap gap-2">
							<span *ngFor="let s of (u.skillsIWantToLearn || [])" class="inline-flex items-center px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 text-xs font-medium">
								{{ s.name }}
								<span class="ml-1 text-[10px] bg-indigo-700 text-white px-2 py-0.5 rounded-full">{{ s.level }}</span>
							</span>
						</div>
					</div>
				</div>

				<!-- Matching hint -->
				<div *ngIf="matchingSkillsTheyTeach().length > 0" class="bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg">
					Great match! They can teach you: <strong>{{ matchingTeachNames() }}</strong>
				</div>
			</div>
		</div>
	</div>
</div>
