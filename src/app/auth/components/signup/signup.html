<div class="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in" (click)="close()">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-lg"></div>
  <div class="relative w-full max-w-md transform transition-all animate-scale-in" (click)="$event.stopPropagation()">
    <button (click)="close()" type="button" class="absolute -top-4 -right-4 w-12 h-12 flex items-center justify-center rounded-full bg-white shadow-xl hover:shadow-2xl text-gray-700 hover:text-gray-900 transition-all hover:scale-110 z-10">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    <div class="bg-white rounded-3xl shadow-2xl p-10 backdrop-blur-sm border-2 border-gray-100">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-linear-to-br from-purple-600 to-pink-500 rounded-2xl mb-5 shadow-lg shadow-purple-500/30">
          <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Join SkillSwap!</h1>
        <p class="text-gray-600">Create your account and start exchanging skills</p>
      </div>
      <form [formGroup]="form" (ngSubmit)="register()" class="space-y-4">
      <!-- Full Name Field -->
      <div>
        <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
        <input 
          type="text" 
          id="name" 
          formControlName="name"
          placeholder="Your full name"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 text-gray-900 placeholder-gray-500 focus:border-indigo-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition"
          [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched">
        <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-sm text-red-600 mt-1">
          <span *ngIf="form.get('name')?.errors?.['required']">Name is required</span>
          <span *ngIf="form.get('name')?.errors?.['minlength']">Name must be at least 2 characters</span>
        </p>
      </div>

      <!-- Email Field -->
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email"
          placeholder="you@example.com"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 text-gray-900 placeholder-gray-500 focus:border-indigo-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition"
          [class.border-red-500]="form.get('email')?.invalid && form.get('email')?.touched">
        <p *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-sm text-red-600 mt-1">
          Please enter a valid email address
        </p>
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
        <div class="relative">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            id="password" 
            formControlName="password"
            placeholder="••••••••"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 text-gray-900 placeholder-gray-500 focus:border-indigo-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition"
            [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched">
          <button 
            type="button" 
            (click)="togglePasswordVisibility()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 transition">
            <svg *ngIf="!showPassword()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg *ngIf="showPassword()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-4.803m5.596-3.856a3.375 3.375 0 11-4.753 4.753m4.753-4.753L3.596 3.596"/>
            </svg>
          </button>
        </div>
        <p *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="text-sm text-red-600 mt-1">
          Password must be at least 6 characters
        </p>
      </div>

      <!-- Confirm Password Field -->
      <div>
        <label for="confirmPassword" class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          formControlName="confirmPassword"
          placeholder="••••••••"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 text-gray-900 placeholder-gray-500 focus:border-indigo-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition"
          [class.border-red-500]="(form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched) || (form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched)">
        <p *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched" class="text-sm text-red-600 mt-1">
          Passwords do not match
        </p>
      </div>

      <!-- Terms Checkbox -->
      <div class="flex items-center">
        <input 
          type="checkbox" 
          id="terms" 
          formControlName="terms"
          class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 cursor-pointer">
        <label for="terms" class="text-sm text-gray-600 ml-3 cursor-pointer">
          I agree to the <a href="#" class="text-indigo-600 hover:text-indigo-700 font-semibold">Terms of Service</a> and <a href="#" class="text-indigo-600 hover:text-indigo-700 font-semibold">Privacy Policy</a>
        </label>
      </div>
      <p *ngIf="form.get('terms')?.invalid && form.get('terms')?.touched" class="text-sm text-red-600">
        You must agree to the terms to sign up
      </p>

      <button 
        type="submit" 
        [disabled]="form.invalid || isLoading()"
        class="w-full bg-linear-to-r from-indigo-600 to-blue-600 text-white font-semibold py-3 rounded-lg hover:shadow-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!isLoading()">Create Account</span>
        <span *ngIf="isLoading()" class="inline-flex items-center">
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Creating account...
        </span>
      </button>
      </form>
      <p class="text-center text-gray-600 text-sm mt-6">
        Already have an account? 
        <button type="button" (click)="onSwitchToSignin()" class="font-semibold text-purple-600 hover:text-purple-700 transition">
          Sign in
        </button>
      </p>
    </div>
  </div>
</div>
